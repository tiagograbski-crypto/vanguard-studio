<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANGUARD STUDIO | Estética de Poder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel for Single File Rendering -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --green-abyssal: #010B07;
            --green-onyx: #03140D;
            --green-lines: #0A2B1D;
            --green-sage-glass: rgba(194, 209, 201, 0.08);
            --gold-light: #FCF6BA;
            --gold-main: #BF953F;
            --gold-dark: #8A631B;
        }

        body {
            background-color: var(--green-abyssal);
            color: #F4F4F4;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-editorial { font-family: 'Playfair Display', serif; }
        
        /* Efeito Ouro Joia com Brilho Interno */
        .text-true-gold {
            background: linear-gradient(to right, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FCF6BA 75%, #BF953F 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Vidro Jateado Sálvia (Quebra Cognitiva) */
        .glass-sage {
            background: linear-gradient(90deg, rgba(3, 20, 13, 0.9) 0%, var(--green-sage-glass) 50%, rgba(3, 20, 13, 0.9) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(191, 149, 63, 0.3);
            border-bottom: 1px solid rgba(191, 149, 63, 0.1);
        }

        /* Contornos Bisotê */
        .glass-contour {
            background: linear-gradient(145deg, rgba(3, 20, 13, 0.8) 0%, rgba(1, 11, 7, 0.95) 100%);
            box-shadow: 
                inset 0 1px 0 rgba(191, 149, 63, 0.15),
                0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--green-lines);
        }

        /* Botão Joia */
        .btn-jewelry {
            background: linear-gradient(135deg, var(--gold-main) 0%, var(--gold-dark) 100%);
            color: var(--green-abyssal);
            font-weight: 800;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .btn-jewelry::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-25deg);
            animation: sweep 3s infinite;
        }

        @keyframes sweep {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .reveal-on-scroll { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
        .is-visible { opacity: 1; transform: translateY(0); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee { display: flex; width: 200%; animation: marquee 25s linear infinite; }

        .text-stroke-gold {
            color: transparent;
            -webkit-text-stroke: 1px rgba(191, 149, 63, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const trendsRef = useRef(null);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollTrends = (dir) => {
                if (trendsRef.current) {
                    const offset = dir === 'left' ? -300 : 300;
                    trendsRef.current.scrollBy({ left: offset, behavior: 'smooth' });
                }
            };

            return (
                <div className="min-h-screen">
                    {/* NAVBAR */}
                    <nav className={`fixed top-0 w-full z-[100] transition-all duration-700 ${isScrolled ? 'glass-contour py-4' : 'py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-full border border-[#BF953F]/40 flex items-center justify-center text-[#BF953F]">
                                    <i data-lucide="diamond" className="w-4 h-4"></i>
                                </div>
                                <span className="text-sm font-bold tracking-[0.3em] uppercase">VANGUARD <span className="text-true-gold font-editorial italic lowercase">studio</span></span>
                            </div>
                            <button onClick={() => setMobileMenuOpen(true)} className="text-[#BF953F]">
                                <i data-lucide="menu" className="w-6 h-6"></i>
                            </button>
                        </div>
                    </nav>

                    {/* MENU MOBILE JATEADO */}
                    <div className={`fixed inset-0 z-[150] transition-all duration-700 ${mobileMenuOpen ? 'opacity-100 visible' : 'opacity-0 invisible'}`} 
                         style={{background: 'rgba(1, 11, 7, 0.95)', backdropFilter: 'blur(30px)'}}>
                        <div className="flex justify-end p-8">
                            <button onClick={() => setMobileMenuOpen(false)} className="text-[#BF953F]"><i data-lucide="x" className="w-8 h-8"></i></button>
                        </div>
                        <div className="flex flex-col items-center gap-8 mt-20">
                            {['O ESTÚDIO', 'SERVIÇOS', 'PORTFÓLIO', 'CONTATO'].map(item => (
                                <a key={item} href="#" className="text-4xl font-editorial italic hover:text-[#BF953F] transition-colors">{item}</a>
                            ))}
                        </div>
                    </div>

                    {/* HERO */}
                    <section className="relative h-screen flex flex-col justify-end pb-24 px-6 overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src="https://projetobarber2026.carrd.co/assets/images/image01.jpg?v=1af6d300" 
                                 className="w-full h-full object-cover grayscale opacity-40 mix-blend-luminosity scale-110" />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#010B07] via-transparent to-transparent"></div>
                        </div>
                        
                        <div className="relative z-10 max-w-7xl mx-auto w-full">
                            <div className="reveal-on-scroll">
                                <span className="text-[10px] tracking-[0.5em] text-[#BF953F] uppercase mb-4 block">Chapecó | Santa Catarina</span>
                                <h1 className="text-[14vw] md:text-[8vw] font-editorial italic leading-[0.9] mb-8">
                                    A Arte do <br/>
                                    <span className="font-sans not-italic font-extrabold text-true-gold tracking-tighter">DETALHE.</span>
                                </h1>
                                <p className="max-w-sm text-xs tracking-[0.2em] text-gray-400 uppercase leading-loose mb-10">
                                    Arquitetamos sua imagem com precisão cirúrgica. Onde o status encontra a maestria.
                                </p>
                                <button className="btn-jewelry px-12 py-5 rounded-sm text-[10px] tracking-[0.4em] uppercase hover:scale-105">
                                    Desbloquear Experiência
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* QUEBRA COGNITIVA - VIDRO SÁLVIA */}
                    <div className="glass-sage py-8 overflow-hidden relative z-20">
                        <div className="animate-marquee items-center gap-12">
                            {[1,2].map(i => (
                                <div key={i} className="flex items-center gap-16 min-w-max px-8">
                                    <span className="text-sm font-bold tracking-[0.3em] uppercase">Estética de Poder</span>
                                    <span className="text-3xl font-editorial italic text-stroke-gold uppercase tracking-widest">Confiança Inabalável</span>
                                    <span className="text-sm font-bold tracking-[0.3em] uppercase">Alta Performance Visual</span>
                                    <i data-lucide="crown" className="w-5 h-5 text-[#BF953F]"></i>
                                    <span className="text-3xl font-editorial italic text-stroke-gold uppercase tracking-widest">Status & Discrição</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* LOOKBOOK BRASIL */}
                    <section className="py-32 px-6">
                        <div className="max-w-7xl mx-auto mb-16 flex justify-between items-end">
                            <div>
                                <h2 className="text-4xl font-editorial italic mb-2">Portfólio</h2>
                                <span className="text-[10px] tracking-[0.3em] text-[#BF953F] uppercase">Maestria Técnica</span>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => scrollTrends('left')} className="p-4 rounded-full border border-white/10 hover:border-[#BF953F] transition-all">
                                    <i data-lucide="chevron-left" className="w-4 h-4"></i>
                                </button>
                                <button onClick={() => scrollTrends('right')} className="p-4 rounded-full border border-white/10 hover:border-[#BF953F] transition-all">
                                    <i data-lucide="chevron-right" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div ref={trendsRef} className="flex gap-6 overflow-x-auto scrollbar-hide snap-x">
                            {[
                                { img: "https://projetobarber2026.carrd.co/assets/images/image02.jpg?v=ec553877", t: "DEGRADÊ NAVALHADO", d: "FADE PERFEITO" },
                                { img: "https://projetobarber2026.carrd.co/assets/images/image03.jpg?v=ec553877", t: "SOCIAL EXECUTIVO", d: "ALINHAMENTO & TESOURA" },
                                { img: "https://projetobarber2026.carrd.co/assets/images/image01.jpg?v=1af6d300", t: "CROP TEXTURIZADO", d: "GEOMETRIA MODERNA" }
                            ].map((item, idx) => (
                                <div key={idx} className="min-w-[85vw] md:min-w-[400px] snap-center glass-contour p-2 rounded-xl">
                                    <div className="relative aspect-[3/4] overflow-hidden rounded-lg">
                                        <img src={item.img} className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" />
                                        <div className="absolute bottom-0 w-full p-6" style={{background: 'linear-gradient(to top, rgba(1,11,7,0.9), transparent)'}}>
                                            <span className="text-[8px] tracking-[0.4em] text-[#BF953F] uppercase block mb-2">{item.d}</span>
                                            <h3 className="text-xl font-editorial italic tracking-wider">{item.t}</h3>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* SERVICES */}
                    <section className="py-32 bg-[#03140D]/30 border-y border-white/5 px-6">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-xs tracking-[0.5em] text-[#BF953F] uppercase mb-16 text-center">O Catálogo</h2>
                            {[
                                { n: "Visagismo de Corte", p: "80", d: "Análise facial e escultura geométrica." },
                                { n: "Barba Royal", p: "70", d: "Vapor de ozônio e toalhas egípcias." },
                                { n: "Experiência Vanguarda", p: "140", d: "O ritual completo de alta performance." }
                            ].map((s, i) => (
                                <div key={i} className="flex justify-between items-center py-10 border-b border-white/5 hover:px-4 transition-all duration-500 group">
                                    <div className="max-w-xs">
                                        <h4 className="text-xl font-editorial italic group-hover:text-[#BF953F] transition-colors">{s.n}</h4>
                                        <p className="text-[9px] tracking-widest text-gray-500 uppercase mt-2">{s.d}</p>
                                    </div>
                                    <div className="flex items-center gap-6">
                                        <span className="text-lg font-editorial">R$ {s.p}</span>
                                        <i data-lucide="arrow-right" className="w-4 h-4 opacity-0 group-hover:opacity-100 group-hover:translate-x-2 transition-all"></i>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* FINAL CTA - FOCO CTR */}
                    <section className="py-40 text-center px-6">
                        <div className="reveal-on-scroll">
                            <i data-lucide="award" className="w-12 h-12 text-[#BF953F] mx-auto mb-8"></i>
                            <h2 className="text-4xl md:text-7xl font-editorial italic leading-tight mb-8">Sua Nova <br/> <span className="text-true-gold font-sans not-italic font-black uppercase tracking-tighter">ASSINATURA</span> Visual.</h2>
                            <button className="btn-jewelry px-20 py-7 rounded-sm text-xs tracking-[0.5em] uppercase shadow-2xl hover:scale-105">
                                Garantir Horário Agora
                            </button>
                        </div>
                    </section>

                    {/* FOOTER MÍNIMO */}
                    <footer className="py-16 border-t border-white/5 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8 opacity-50">
                            <span className="text-[10px] tracking-[0.3em] uppercase">Vanguard Studio © 2026</span>
                            <div className="flex gap-8">
                                <a href="#" className="text-[10px] tracking-[0.3em] uppercase hover:text-[#BF953F]">Instagram</a>
                                <a href="#" className="text-[10px] tracking-[0.3em] uppercase hover:text-[#BF953F]">Termos</a>
                            </div>
                        </div>
                    </footer>

                    {/* WHATSAPP FLOAT */}
                    <a href="https://wa.me/5549999999999" className="fixed bottom-8 right-8 z-[200] w-16 h-16 btn-jewelry rounded-full flex items-center justify-center shadow-2xl">
                        <i data-lucide="phone" className="w-6 h-6"></i>
                    </a>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize icons after React render
        setTimeout(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
